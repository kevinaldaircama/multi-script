<div class="card form"><h2>➕ Crear cuenta</h2><form method="post" action="{{PREFIX}}/account/create"><input type="hidden" name="ad_token" value="{{ADPASS}}"><label>Usuario</label><input class="input" name="username" value="{{USERNAME}}" required pattern="[a-z][a-z0-9_-]{2,31}"><label>Contraseña</label><input class="input" name="password" value="{{PASSWORD}}" type="text" required minlength="4"><label>Días</label><input class="input" name="days" type="number" value="{{DAYS}}" min="1" max="3650"><label>Límite IP</label><input class="input" name="limit" type="number" value="{{LIMIT}}" min="0" max="100"><button class="btn primary">Crear cuenta</button></form></div>
