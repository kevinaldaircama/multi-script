<div class="hero"><h1>✨ Crear cuenta</h1><p class="muted">Elige el protocolo y crea una cuenta con el formato de KevinTech Multi Script.</p></div><div class="card form"><form method="post" action="{{PREFIX}}/account/create" id="create-account-form"><label>Protocolo</label><select class="input" name="type" id="account-type"><option value="ssh">🔐 SSH</option><option value="xray">🚀 V2Ray/Xray (VMess)</option><option value="socks5">🔌 SOCKS5</option><option value="wireguard">🛡️ WireGuard</option><option value="zivpn">⚡ ZiVPN UDP</option><option value="openvpn">🌐 OpenVPN</option><option value="btun">⚡ BTUN</option><option value="shadowsocks">🕶️ Shadowsocks</option><option value="hysteria">🚀 Hysteria</option></select><label>Usuario / nombre de cliente</label><input class="input" name="username" required pattern="[a-z][a-z0-9_-]{2,31}" placeholder="usuario" autocomplete="off"><div id="password-wrap"><label id="password-label">Contraseña (SSH / SOCKS5 / ZiVPN)</label><input class="input" name="password" id="account-password" type="text" minlength="4" placeholder="Contraseña segura"></div>{{ADMIN_FIELDS}}<div class="notice" id="protocol-help">La contraseña se utilizará para autenticar la cuenta.</div><button class="btn primary" style="width:100%">🚀 Crear cuenta</button></form></div><script>(function(){const t=document.getElementById('account-type'),w=document.getElementById('password-wrap'),p=document.getElementById('account-password'),l=document.getElementById('password-label'),h=document.getElementById('protocol-help');function sync(){const v=t.value;const need=['ssh','socks5','zivpn','btun','shadowsocks','hysteria'].includes(v);w.hidden=!need;p.required=need;p.disabled=!need;l.textContent=({'zivpn':'Contraseña ZiVPN (mínimo 4 caracteres)','socks5':'Contraseña SOCKS5','btun':'Contraseña BTUN','shadowsocks':'Contraseña Shadowsocks (mínimo 8 caracteres)','hysteria':'Contraseña Hysteria','ssh':'Contraseña SSH'})[v]||'Contraseña';p.minLength=v==='shadowsocks'?8:4;h.textContent=({'openvpn':'Se generará un perfil .ovpn descargable. OpenVPN y EasyRSA deben estar instalados y tener la PKI configurada.','wireguard':'Se generará la configuración WireGuard; el QR aparecerá si qrencode está instalado.','zivpn':'Se añadirá la contraseña al servicio ZiVPN instalado.','btun':'Se añadirá el usuario y contraseña al archivo de autenticación del servicio BTUN activo.','shadowsocks':'Se creará una instancia independiente con puerto y contraseña propios.','hysteria':'Se creará un usuario del sistema autenticado por PAM para Hysteria.','xray':'Se creará un cliente VMess/Xray.','socks5':'Se creará un usuario del sistema para SOCKS5.'})[v]||'La duración y el límite se aplican según las cuotas configuradas.'}t.addEventListener('change',sync);sync()})();</script>
