<div class="hero"><h1>✨ Crear cuenta</h1><p class="muted">Elige el protocolo y crea una cuenta con el formato de KevinTech Multi Script.</p></div><div class="card form"><form method="post" action="{{PREFIX}}/account/create" id="create-account-form"><label>Protocolo</label><select class="input" name="type" id="account-type"><option value="ssh">🔐 SSH</option><option value="xray">🚀 V2Ray/Xray (VMess)</option><option value="socks5">🔌 SOCKS5</option><option value="wireguard">🛡️ WireGuard</option><option value="zivpn">⚡ ZiVPN UDP</option><option value="openvpn">🌐 OpenVPN</option><option value="btun">⚡ BTUN</option>{{SHADOWSOCKS_OPTION}}<option value="hysteria">🚀 Hysteria</option></select><label>Usuario / nombre de cliente</label><input class="input" name="username" required pattern="[a-z][a-z0-9_-]{2,31}" placeholder="usuario" autocomplete="off"><div id="password-wrap"><label id="password-label">Contraseña (SSH / SOCKS5 / ZiVPN)</label><input class="input" name="password" id="account-password" type="text" minlength="4" placeholder="Contraseña segura"></div>{{ADMIN_FIELDS}}<div class="notice" id="protocol-help">La contraseña se utilizará para autenticar la cuenta.</div><button class="btn primary" style="width:100%">🚀 Crear cuenta</button></form></div><script>(function(){const t=document.getElementById('account-type'),w=document.getElementById('password-wrap'),p=document.getElementById('account-password'),l=document.getElementById('password-label'),h=document.getElementById('protocol-help');function sync(){const v=t.value;const need=['ssh','socks5','zivpn','btun','shadowsocks','hysteria'].includes(v);w.hidden=!need;p.required=need;p.disabled=!need;l.textContent=({'zivpn':'Contraseña ZiVPN (mínimo 4 caracteres)','socks5':'Contraseña SOCKS5','btun':'Contraseña BTUN','shadowsocks':'Contraseña Shadowsocks (mínimo 8 caracteres)','hysteria':'Contraseña Hysteria','ssh':'Contraseña SSH'})[v]||'Contraseña';p.minLength=v==='shadowsocks'?8:4;h.textContent=({'ssh':'Igual que usuarios/add.sh: crea el usuario Linux, aplica expiración y límite IP, instala CheckUser/limitador y sincroniza la contraseña con ZiVPN si está instalado. La misma cuenta sirve para los transportes SSH habilitados en el VPS.','openvpn':'Se generará un perfil .ovpn descargable usando la PKI y EasyRSA del instalador protocolos/openvpn.sh.','wireguard':'Se generará un peer como protocolos/wireguard.sh, con archivo .conf y QR si qrencode está instalado.','zivpn':'Se añadirá la contraseña a auth.config[] y se reiniciará el servicio, igual que protocolos/zivpn.sh.','btun':'Igual que protocolos/btun.sh: añade usuario:clave a /etc/btun/users y reinicia btun. BTUN no gestiona caducidad individual.','shadowsocks':'Igual que protocolos/shadowsocks.sh: usa SS_PORT, aes-256-gcm y TCP + UDP. El script tiene una sola clave compartida para todo el servidor.','hysteria':'Igual que protocolos/histeria.sh: Hysteria V1 usa el usuario y contraseña SSH; no crea un usuario Hysteria independiente.','xray':'Se crea un cliente VMess/Xray siguiendo protocolos/v2ray.sh.','socks5':'Igual que protocolos/socks5.sh: aplica SOCKS5_USER_PREFIX, crea el usuario del sistema y lo registra en /etc/kevintech/socks5-users.'})[v]||'La duración y el límite se aplican según las cuotas configuradas.'}t.addEventListener('change',sync);sync()})();</script>
