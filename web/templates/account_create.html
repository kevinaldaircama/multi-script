<div class="hero"><h1>➕ Crear cuenta</h1><p class="muted">{{ADMIN_NOTE}}</p></div><div class="card form"><form method="post" action="{{PREFIX}}/account/create"><label>Protocolo</label><select class="input" name="type"><option value="ssh">SSH</option><option value="xray">Xray (VMess)</option><option value="socks5">SOCKS5</option><option value="wireguard">WireGuard</option></select><label>Usuario</label><input class="input" name="username" required pattern="[a-z][a-z0-9_-]{2,31}" placeholder="usuario"><label>Contraseña (SSH / SOCKS5)</label><input class="input" name="password" type="text" minlength="4" placeholder="Contraseña SSH">{{ADMIN_FIELDS}}<button class="btn primary">Crear cuenta</button></form></div>
