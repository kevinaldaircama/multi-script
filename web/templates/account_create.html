<div class="hero"><h1>✨ Crear cuenta</h1><p class="muted">Elige el protocolo y crea una cuenta con el formato de KevinTech Multi Script.</p></div><div class="card form"><form method="post" action="{{PREFIX}}/account/create" id="create-account-form"><label>Protocolo</label><select class="input" name="type" id="account-type">{{PROTOCOL_OPTIONS}}</select><label>Usuario / nombre de cliente</label><input class="input" name="username" required pattern="[a-z][a-z0-9_-]{2,31}" placeholder="usuario" autocomplete="off"><div id="password-wrap"><label id="password-label">Contraseña (SSH / SOCKS5 / ZiVPN)</label><input class="input" name="password" id="account-password" type="text" minlength="4" placeholder="Contraseña segura"></div>{{ADMIN_FIELDS}}<div class="notice" id="protocol-help">La contraseña se utilizará para autenticar la cuenta.</div><button class="btn primary" style="width:100%">🚀 Crear cuenta</button></form></div><script>(function(){const t=document.getElementById('account-type'),w=document.getElementById('password-wrap'),p=document.getElementById('account-password'),l=document.getElementById('password-label'),h=document.getElementById('protocol-help');function sync(){const v=t.value;const need=['ssh','socks5','zivpn'].includes(v);w.hidden=!need;p.required=need;p.disabled=!need;l.textContent=v==='zivpn'?'Contraseña ZiVPN (mínimo 4 caracteres)':v==='socks5'?'Contraseña SOCKS5':'Contraseña SSH';h.textContent=v==='openvpn'?'Se generará un perfil .ovpn descargable. OpenVPN debe estar instalado y tener su PKI configurada.':v==='wireguard'?'Se generará la configuración WireGuard; el QR aparecerá si qrencode está instalado en el VPS.':v==='zivpn'?'Se añadirá la contraseña al servicio ZiVPN ya instalado.':'La duración y el límite se aplican según las cuotas configuradas.'}t.addEventListener('change',sync);sync()})();</script>
