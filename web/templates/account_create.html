<div class="hero"><h1>➕ Crear cuenta</h1><p class="muted">Los días, el límite IP y la cuota se aplican automáticamente desde la configuración del administrador. Cada usuario necesita 3 puntos por cuenta.</p></div><div class="card form"><form method="post" action="{{PREFIX}}/account/create"><label>Protocolo</label><select class="input" name="type"><option value="ssh">SSH</option><option value="v2ray">V2Ray / VMess</option></select><label>Usuario</label><input class="input" name="username" required pattern="[a-z][a-z0-9_-]{2,31}" placeholder="usuario"><label>Contraseña (solo SSH)</label><input class="input" name="password" type="text" minlength="4" placeholder="Contraseña SSH"><button class="btn primary">Crear cuenta</button></form></div>
