<div class="card form"><h2>Crear cuenta web</h2>{{MSG}}<form method="post"><label>Nombre</label><input class="input" name="name" required><label>Usuario</label><input class="input" name="username" required pattern="[A-Za-z0-9_.-]{3,32}"><label>Contraseña</label><input class="input" name="password" type="password" minlength="6" required><label>Código de referido (opcional)</label><input class="input" name="ref" value="{{REF}}"><button class="btn primary">Registrarme</button></form><p><a href="{{PREFIX}}/login">Ya tengo cuenta</a></p></div>
