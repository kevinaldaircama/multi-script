<div class="hero"><h1>⚙️ Configuración</h1><p class="muted">Administra acceso y comportamiento de publicidad.</p></div><div class="card form"><form method="post"><label>Usuario admin</label><input class="input" name="admin_username" value="{{USERNAME}}"><label>Nueva contraseña <span class="muted">(vacío = conservar)</span></label><input class="input" name="admin_password" type="password"><div class="divider"></div><h3>💰 Publicidad</h3><label><input type="checkbox" name="ads_enabled" {{ADS_CHECKED}}> Activar anuncios</label><label>Proveedor</label><select class="input" name="ad_provider"><option value="monetag" {{PROVIDER_CHECKED}}>Monetag</option></select><label>Zone ID</label><input class="input" name="monetag_zone" value="{{ZONE}}"><div class="grid"><div><label>Crear</label><input class="input" name="ad_create" type="number" min="0" max="20" value="{{CREATE}}"></div><div><label>Eliminar</label><input class="input" name="ad_delete" type="number" min="0" max="20" value="{{DELETE}}"></div><div><label>Renovar</label><input class="input" name="ad_renew" type="number" min="0" max="20" value="{{RENEW}}"></div></div><button class="btn primary">Guardar cambios</button></form></div>
