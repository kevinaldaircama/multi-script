<div class="card form"><h2>⚙️ Datos del administrador</h2><form method="post"><label>Usuario admin</label><input class="input" name="admin_username" value="{{USERNAME}}"><label>Nueva contraseña (vacío = no cambiar)</label><input class="input" name="admin_password" type="password"><hr><h3>Ads</h3><label><input type="checkbox" name="ads_enabled" {{ADS_CHECKED}}> Activar anuncios</label><label>Proveedor</label><select class="input" name="ad_provider"><option value="monetag" {{PROVIDER_CHECKED}}>Monetag</option></select><label>Zone ID</label><input class="input" name="monetag_zone" value="{{ZONE}}"><label>Ads para crear</label><input class="input" name="ad_create" type="number" min="0" max="20" value="{{CREATE}}"><label>Ads para eliminar</label><input class="input" name="ad_delete" type="number" min="0" max="20" value="{{DELETE}}"><label>Ads para renovar</label><input class="input" name="ad_renew" type="number" min="0" max="20" value="{{RENEW}}"><button class="btn primary">Guardar</button></form></div>
