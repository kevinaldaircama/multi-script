<div class="hero"><h1>⚙️ Configuración</h1><p class="muted">Perfil, ads, ajustes generales, cuotas y contenido público.</p></div><div class="card form"><form method="post"><h3>👤 Perfil admin</h3><label>Usuario admin</label><input class="input" name="admin_username" value="{{USERNAME}}"><label>Nueva contraseña</label><input class="input" name="admin_password" type="password"><div class="divider"></div><h3>📢 Ajuste de ads</h3><label><input type="checkbox" name="ads_enabled" {{ADS_CHECKED}}> Activar publicidad</label><label>Zona Monetag</label><input class="input" name="monetag_zone" value="{{ZONE}}"><div class="grid"><div><label>Ads crear</label><input class="input" type="number" name="ad_create" value="{{CREATE}}" min="0" max="20"></div><div><label>Ads eliminar</label><input class="input" type="number" name="ad_delete" value="{{DELETE}}" min="0" max="20"></div><div><label>Ads renovar</label><input class="input" type="number" name="ad_renew" value="{{RENEW}}" min="0" max="20"></div></div><div class="divider"></div><h3>📝 Ajuste general</h3><label>Título</label><input class="input" name="site_title" value="{{SITE_TITLE}}"><label>Descripción</label><textarea name="site_description" rows="3">{{SITE_DESC}}</textarea><div class="divider"></div><h3>📏 Cuotas de creación</h3><div class="grid"><div class="card"><h4>SSH</h4><label>Días</label><input class="input" type="number" name="ssh_days" value="{{SSH_DAYS}}"><label>Límite IP</label><input class="input" type="number" name="ssh_limit" value="{{SSH_LIMIT}}"></div><div class="card"><h4>V2Ray / VMess</h4><label>Días</label><input class="input" type="number" name="v2ray_days" value="{{V2_DAYS}}"><label>Límite IP</label><input class="input" type="number" name="v2ray_limit" value="{{V2_LIMIT}}"></div></div><div class="divider"></div><h3>ℹ️ About editable</h3><label>Sobre nosotros</label><textarea name="about" rows="4">{{ABOUT}}</textarea><label>Política de privacidad</label><textarea name="privacy" rows="4">{{PRIVACY}}</textarea><label>Política de cookies</label><textarea name="cookies" rows="4">{{COOKIES}}</textarea><label>Términos y condiciones</label><textarea name="terms" rows="4">{{TERMS}}</textarea><button class="btn primary" style="width:100%">Guardar configuración</button></form></div>
