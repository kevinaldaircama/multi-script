<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101a"><meta name="robots" content="noindex"><title>{{TITLE}} · {{SITE_TITLE}}</title><style>
:root{--bg:#050a11;--panel:#0a131e;--panel2:#0d1a28;--line:#173247;--text:#eaf7ff;--muted:#8ba5b7;--cyan:#38d9ff;--green:#63f2a5;--red:#ff6f86;--yellow:#ffd166;--shadow:0 18px 60px rgba(0,0,0,.32)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#12324a 0,transparent 32%),radial-gradient(circle at 100% 0,#17263b 0,transparent 25%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}a{color:var(--cyan);text-decoration:none}.topbar{position:sticky;top:0;z-index:70;height:66px;display:flex;align-items:center;justify-content:flex-start;padding:0 18px;background:rgba(5,10,17,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.menu-toggle{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:#0b1824;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.2)}.sidebar{position:fixed;z-index:100;left:0;top:0;height:100vh;width:min(330px,88vw);padding:18px;background:rgba(7,15,24,.98);border-right:1px solid var(--line);box-shadow:25px 0 70px rgba(0,0,0,.42);transform:translateX(-105%);transition:.25s ease;display:flex;flex-direction:column}.sidebar.open{transform:translateX(0)}.menu-close{float:right;border:1px solid var(--line);border-radius:9px;background:#102638;color:#fff;font-size:24px;line-height:1;width:34px;height:34px;cursor:pointer}.menu-open{overflow:hidden}.backdrop{z-index:90}.sidebar{isolation:isolate;pointer-events:auto}.menu-toggle{touch-action:manipulation;position:relative;z-index:71}.brand{font-weight:950;font-size:19px;padding:10px 12px 18px;border-bottom:1px solid var(--line)}.menu-scroll{overflow:auto;padding:12px 0}.menu-group{margin-bottom:6px}.menu-item,.menu-item-link{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:#d7edf8;padding:13px 12px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;text-align:left}.menu-item:hover,.menu-item-link:hover{background:#102638;color:#fff}.submenu{display:none;padding:3px 0 6px 12px}.submenu.open{display:block}.submenu a{display:block;padding:10px 12px;border-radius:10px;color:#a9c8d8;font-size:14px}.submenu a:hover{background:#0e2332;color:#fff}.exit{margin-top:auto;color:#ff9aaa!important;border-top:1px solid var(--line);padding-top:16px}.wrap{width:min(1180px,100%);margin:auto;padding:26px 18px 50px}.hero{padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(18,43,62,.9),rgba(8,17,28,.92));box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,40px)}.hero p{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.18)}.form{max-width:680px;margin:35px auto}.stat{font-size:30px;font-weight:900}.stat-label{color:var(--muted);margin-top:5px}.input,select,textarea{display:block;width:100%;padding:12px 13px;margin:7px 0 14px;border-radius:11px;border:1px solid #28465d;background:#06101a;color:#fff;outline:none;font:inherit}.input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #38d9ff18}.btn{display:inline-block;border:1px solid #2b5871;padding:10px 14px;border-radius:11px;background:#12283a;color:#fff;cursor:pointer;font-weight:750;margin:3px}.btn:hover{filter:brightness(1.15)}.primary{background:#0b7193;border-color:#20b8df}.danger{background:#702536;border-color:#a63a51}.notice{padding:13px 15px;border-radius:12px;margin:12px 0;background:#162638;border:1px solid var(--line)}.bad{background:#3a1721;border-color:#6c2938;color:#ffadba}.oktxt{color:var(--green)}.muted,.small{color:var(--muted)}.small{font-size:13px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#132a3d;border:1px solid #24465d;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #173247;text-align:left}.table th{color:#a9c6d7;font-size:13px}.terminal{background:#020508;border:1px solid #183b4f;padding:15px;border-radius:14px;min-height:360px;white-space:pre-wrap;overflow:auto;color:#bff4ff;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.cmdrow{display:flex;gap:8px}.cmdrow .input{flex:1}.service-card{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#091520}.service-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#102a3d;font-size:20px}.service-main{flex:1;display:flex;flex-direction:column;gap:3px}.status{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.status.on{color:#001a0d;background:#63f2a5}.status.off{color:#ffe8ec;background:#702536}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:25px 0 12px}.divider{height:1px;background:var(--line);margin:20px 0}code,.codebox{word-break:break-all;color:#c5f3ff}.actions{display:flex;gap:6px;flex-wrap:wrap}.inline{display:inline}.account-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.account-head h3{margin:0}.copybox{white-space:pre-wrap;background:#02080d;border:1px solid #183b4f;border-radius:14px;padding:16px;overflow:auto;font:13px ui-monospace,monospace;color:#d8f8ff}.backdrop{display:none;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.48)}.backdrop.show{display:block}@media(max-width:650px){.topbar{height:58px;padding:0 10px}.wrap{padding:14px 10px 35px}.card,.panel{padding:16px}.hero{padding:20px}.cmdrow{flex-direction:column}.table{min-width:580px}.account-head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="topbar">{{TOGGLE}}</div>{{SIDEBAR}}<div class="backdrop" id="backdrop" aria-hidden="true"></div><main class="wrap">{{BODY}}</main><script>(()=>{const t=document.getElementById('menuToggle'),s=document.getElementById('sidebar'),b=document.getElementById('backdrop'),c=document.getElementById('menuClose');const open=()=>{if(!s||!b)return;s.classList.add('open');b.classList.add('show');if(t)t.setAttribute('aria-expanded','true');document.body.classList.add('menu-open')};const close=()=>{if(!s||!b)return;s.classList.remove('open');b.classList.remove('show');if(t)t.setAttribute('aria-expanded','false');document.body.classList.remove('menu-open')};if(t)t.addEventListener('click',e=>{e.preventDefault();s&&s.classList.contains('open')?close():open()});if(c)c.addEventListener('click',close);if(b)b.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelectorAll('.has-sub').forEach(x=>x.addEventListener('click',()=>{const sub=x.nextElementSibling;if(!sub)return;const isOpen=sub.classList.toggle('open');x.setAttribute('aria-expanded',String(isOpen))}));})();</script></body></html>
