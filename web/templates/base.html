<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101a"><meta name="robots" content="noindex"><title>{{TITLE}} · {{SITE_TITLE}}</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
:root{--bg:#050a11;--panel:#0a131e;--panel2:#0d1a28;--line:#173247;--text:#eaf7ff;--muted:#8ba5b7;--cyan:#38d9ff;--green:#63f2a5;--red:#ff6f86;--yellow:#ffd166;--shadow:0 18px 60px rgba(0,0,0,.32)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#12324a 0,transparent 32%),radial-gradient(circle at 100% 0,#17263b 0,transparent 25%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}a{color:var(--cyan);text-decoration:none}.topbar{position:sticky;top:0;z-index:70;height:66px;display:flex;align-items:center;justify-content:flex-start;padding:0 18px;background:rgba(5,10,17,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.menu-toggle{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:#0b1824;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.2)}.sidebar{position:fixed;z-index:100;left:0;top:0;height:100vh;width:min(330px,88vw);padding:18px;background:rgba(7,15,24,.98);border-right:1px solid var(--line);box-shadow:25px 0 70px rgba(0,0,0,.42);transform:translateX(-105%);transition:.25s ease;display:flex;flex-direction:column}.sidebar.open{transform:translateX(0)}.menu-close{float:right;border:1px solid var(--line);border-radius:9px;background:#102638;color:#fff;font-size:24px;line-height:1;width:34px;height:34px;cursor:pointer}.menu-open{overflow:hidden}.backdrop{z-index:90}.sidebar{isolation:isolate;pointer-events:auto}.menu-toggle{touch-action:manipulation;position:relative;z-index:71}.brand{font-weight:950;font-size:19px;padding:10px 12px 18px;border-bottom:1px solid var(--line)}.menu-scroll{overflow:auto;padding:12px 0}.menu-group{margin-bottom:6px}.menu-item,.menu-item-link{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:#d7edf8;padding:13px 12px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;text-align:left}.menu-item: body[data-theme="light"]{--bg:#f2f6fa;--panel:#ffffff;--panel2:#ffffff;--line:#d5e0e8;--text:#152534;--muted:#586d7d;--cyan:#087ca5;--green:#087b45;--red:#a3213c;--yellow:#956400;--shadow:0 12px 32px rgba(20,45,65,.10);background:#f2f6fa;color:var(--text)}

.expiry-modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px}.expiry-modal-card{position:relative;width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 25px 90px rgba(0,0,0,.4)}.expiry-modal-card h2{margin-top:0}.modal-x{position:absolute;right:12px;top:10px;border:0;background:transparent;color:var(--text);font-size:28px;cursor:pointer}.theme-actions{border-top:1px solid var(--line);padding-top:8px}.theme-actions button{cursor:pointer}

</style></head><body data-lang="{{LANG}}" data-theme="dark"><div class="topbar">{{TOGGLE}}</div>{{SIDEBAR}}<div class="backdrop" id="backdrop" aria-hidden="true"></div><main class="wrap">{{BODY}}</main><script>(()=>{const t=document.getElementById('menuToggle'),s=document.getElementById('sidebar'),b=document.getElementById('backdrop'),c=document.getElementById('menuClose');const open=()=>{if(!s||!b)return;s.classList.add('open');b.classList.add('show');if(t)t.setAttribute('aria-expanded','true');document.body.classList.add('menu-open')};const close=()=>{if(!s||!b)return;s.classList.remove('open');b.classList.remove('show');if(t)t.setAttribute('aria-expanded','false');document.body.classList.remove('menu-open')};if(t)t.addEventListener('click',e=>{e.preventDefault();s&&s.classList.contains('open')?close():open()});if(c)c.addEventListener('click',close);if(b)b.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelectorAll('.has-sub').forEach(x=>x.addEventListener('click',()=>{const sub=x.nextElementSibling;if(!sub)return;const isOpen=sub.classList.toggle('open');x.setAttribute('aria-expanded',String(isOpen))}));
document.querySelectorAll('[data-open-dialog]').forEach(btn=>btn.addEventListener('click',()=>document.getElementById(btn.dataset.openDialog)?.showModal()));document.querySelectorAll('[data-close-dialog]').forEach(btn=>btn.addEventListener('click',()=>btn.closest('dialog')?.close()));document.querySelectorAll('dialog.config-dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
const body=document.body;let theme='dark';try{theme=localStorage.getItem('kt_theme')||'dark'}catch(e){};const themeBtn=document.getElementById('themeToggle');const setTheme=v=>{body.setAttribute('data-theme',v);try{localStorage.setItem('kt_theme',v)}catch(e){};if(themeBtn)themeBtn.innerHTML=(v==='dark'?'<i class="fa-solid fa-sun"></i> Cambiar a modo claro':'<i class="fa-solid fa-moon"></i> Cambiar a modo oscuro')};setTheme(theme);themeBtn?.addEventListener('click',()=>setTheme(body.getAttribute('data-theme')==='dark'?'light':'dark'));

})();</script><dialog id="confirmDialog" class="config-dialog"><form method="dialog"><h3>Confirmar acción</h3><p id="confirmText"></p><div class="actions"><button class="btn" value="cancel">Cancelar</button><button class="btn danger" id="confirmProceed" value="ok">Continuar</button></div></form></dialog><script>document.querySelectorAll('[data-confirm]').forEach(function(el){el.addEventListener('click',function(ev){ev.preventDefault();var d=document.getElementById('confirmDialog');document.getElementById('confirmText').textContent=el.getAttribute('data-confirm');d.showModal();document.getElementById('confirmProceed').onclick=function(){d.close();el.closest('form').submit();};});});</script></body></html>
