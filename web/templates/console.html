<div class="hero"><h1>⌨️ Consola</h1><p class="muted">Solo el administrador puede ejecutar comandos.</p></div><div class="card"><pre id="out" class="terminal">KevinTech Web Console
Escribe un comando y pulsa Ejecutar.</pre><form class="cmdrow" id="f"><input class="input" id="cmd" placeholder="Ej.: systemctl status xray --no-pager"><button class="btn primary">Ejecutar</button></form></div><script>f.onsubmit=async e=>{e.preventDefault();let c=cmd.value.trim();if(!c)return;out.textContent+='\n$ '+c+'\n';let d=new URLSearchParams();d.set('command',c);let r=await fetch('{{PREFIX}}/console',{method:'POST',body:d});out.textContent+=await r.text()+'\n';out.scrollTop=out.scrollHeight;cmd.value=''}</script>
