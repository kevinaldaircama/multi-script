<div class="hero"><h1><i class="fa-solid fa-envelope-circle-check"></i> Configuración SMTP</h1><p class="muted">Configura el servidor de correo para enviar las notificaciones también por email. La contraseña guardada se mantiene protegida.</p><p><a class="btn" href="{{PREFIX}}/admin/notifications"><i class="fa-solid fa-arrow-left"></i> Volver a notificaciones</a></p></div>
<div class="card form"><form method="post"><input type="hidden" name="action" value="smtp_save"><label><input type="checkbox" name="smtp_enabled" {{SMTP_ENABLED}}> Activar envío por correo</label><label>Servidor SMTP</label><input class="input" name="smtp_host" value="{{SMTP_HOST}}" placeholder="smtp.gmail.com" required><label>Puerto</label><input class="input" type="number" name="smtp_port" min="1" max="65535" value="{{SMTP_PORT}}" required><label>Seguridad</label><select class="input" name="smtp_security"><option value="starttls" {{SMTP_STARTTLS}}>STARTTLS (puerto 587)</option><option value="ssl" {{SMTP_SSL}}>SSL/TLS (puerto 465)</option><option value="none" {{SMTP_NONE}}>Sin cifrado (no recomendado)</option></select><label>Usuario SMTP</label><input class="input" name="smtp_username" value="{{SMTP_USER}}" autocomplete="username"><label>Contraseña SMTP</label><input class="input" type="password" name="smtp_password" autocomplete="new-password" placeholder="Dejar vacío para conservar la actual"><label>Correo remitente</label><input class="input" type="email" name="smtp_from_email" value="{{SMTP_FROM}}" required><label>Nombre remitente</label><input class="input" name="smtp_from_name" value="{{SMTP_NAME}}"><button class="btn primary"><i class="fa-solid fa-floppy-disk"></i> Guardar SMTP</button></form><hr><form method="post"><input type="hidden" name="action" value="smtp_test"><label>Enviar correo de prueba a</label><input class="input" type="email" name="test_email" value="{{TEST_EMAIL}}" required><button class="btn"><i class="fa-solid fa-paper-plane"></i> Enviar correo de prueba</button></form></div>
