<div class="card" style="max-width:520px;margin:auto;text-align:center"><h2>💰 Anuncio {{COUNT}}</h2><p class="muted">Completa la publicidad para continuar con: <b>{{ACTION}}</b>.</p><button id="ad" class="btn primary">▶ Ver anuncio</button><p id="status" class="muted"></p><form id="done" method="post" action="{{COMPLETE}}"><input type="hidden" name="token" value="{{TOKEN}}"></form></div><script src="https://libtl.com/sdk.js" data-zone="{{ZONE}}" data-sdk="show_{{ZONE}}"></script><script>const b=document.getElementById('ad'),s=document.getElementById('status');b.onclick=async()=>{b.disabled=true;s.textContent='Cargando publicidad...';try{const fn=window['show_{{ZONE}}'];if(typeof fn!=='function')throw Error('SDK no disponible');await fn();s.textContent='Anuncio completado';document.getElementById('done').submit()}catch(e){s.textContent='No se pudo cargar el anuncio. Intenta nuevamente.';b.disabled=false}}</script>
