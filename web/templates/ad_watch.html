<div class="card form" style="text-align:center"><h2>💰 Publicidad</h2><p class="muted">Completa {{COUNT}} anuncio(s) para continuar con <b>{{ACTION}}</b>.</p><button id="ad" class="btn primary">▶ Ver anuncio</button><p id="status" class="muted"></p><form id="done" method="post" action="{{COMPLETE}}"><input type="hidden" name="token" value="{{TOKEN}}"></form></div><script src="https://libtl.com/sdk.js" data-zone="{{ZONE}}" data-sdk="show_{{ZONE}}"></script><script>const b=document.getElementById('ad'),s=document.getElementById('status'),count=Math.max(1,parseInt('{{COUNT}}',10)||1);b.onclick=async()=>{b.disabled=true;try{const fn=window['show_{{ZONE}}'];if(typeof fn!=='function')throw Error('SDK no disponible');for(let i=1;i<=count;i++){s.textContent='Mostrando anuncio '+i+' de '+count+'...';await fn()}s.textContent='Publicidad completada. Continuando...';document.getElementById('done').submit()}catch(e){s.textContent='No se pudo completar la publicidad. Comprueba el bloqueador de anuncios e inténtalo de nuevo.';b.disabled=false}}</script>
